{% extends "signin_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset password</h1>
<p class="desc">Enter your email address. If it has an account, we will send a link to set a new password.</p>
<form method="post">{% csrf_token %}
  <div class="field"><label for="id_email">Email</label>{{ form.email }}{{ form.email.errors }}</div>
  <button class="btn block">Send reset link</button>
</form>
<div class="signin-foot"><a href="{% url 'login' %}">Back to sign in</a></div>
{% endblock %}
