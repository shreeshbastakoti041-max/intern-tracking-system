# Render Blueprint: https://render.com/docs/blueprint-spec
# Free setup: Render's free web service + a free external PostgreSQL database (e.g. Neon).
# No paid Render resources are created. Redeploys automatically on every push to main.
services:
  - type: web
    name: osp-intern-tracker
    runtime: python
    plan: free            # free: sleeps after ~15 min idle, wakes in ~30-60 s
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py ensure_admin &&
      gunicorn intern_tracker.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL
        value: "true"
      # Asked for when you create the Blueprint:
      # the connection string from your free Neon (or other PostgreSQL) database.
      - key: DATABASE_URL
        sync: false
      # Used once to create your admin login; delete after the first sign-in.
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
