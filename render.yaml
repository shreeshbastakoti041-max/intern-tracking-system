# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the web app and a PostgreSQL database, and redeploys on every push to main.
services:
  - type: web
    name: osp-intern-tracker
    runtime: python
    plan: free            # sleeps when idle; change to "starter" for always-on
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py ensure_admin &&
      gunicorn intern_tracker.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: osp-intern-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL
        value: "true"
      # Asked for when you create the Blueprint; used once to create your admin login.
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false

databases:
  - name: osp-intern-tracker-db
    plan: basic-256mb     # paid: free Render databases are deleted after 30 days
    region: oregon
    databaseName: tracker
    user: tracker
